<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#1a3a5c"/>
  <!-- Land parcel polygon shape -->
  <polygon points="10,50 20,18 44,14 54,38 36,54" fill="none" stroke="#f0a500" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Interior fill -->
  <polygon points="10,50 20,18 44,14 54,38 36,54" fill="#f0a500" fill-opacity="0.18"/>
  <!-- Corner dots (boundary points) -->
  <circle cx="10" cy="50" r="3" fill="#f0a500"/>
  <circle cx="20" cy="18" r="3" fill="#f0a500"/>
  <circle cx="44" cy="14" r="3" fill="#f0a500"/>
  <circle cx="54" cy="38" r="3" fill="#f0a500"/>
  <circle cx="36" cy="54" r="3" fill="#f0a500"/>
  <!-- Highlighted GCP point with crosshair -->
  <circle cx="44" cy="14" r="5.5" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="44" y1="8" x2="44" y2="20" stroke="#ff6b6b" stroke-width="1.5"/>
  <line x1="38" y1="14" x2="50" y2="14" stroke="#ff6b6b" stroke-width="1.5"/>
  <!-- Arrow transform indicator -->
  <path d="M30,32 L38,32" stroke="#7ecfff" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7ecfff"/>
    </marker>
  </defs>
</svg>
